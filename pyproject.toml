[project]
name = "ai-orbit-solar-power-plant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "reflex==0.9.5.post2",
    "pandas==2.3.3",
    "numpy==2.3.5",
    "scikit-learn==1.9.0",
    "xgboost==3.2.0",
    "python-dotenv==1.2.2",
    "requests==2.33.0",
    "psutil==7.2.2",
    "filelock==3.29.0",
    "psycopg2-binary==2.9.12",
    "torch==2.10.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
py-modules = []